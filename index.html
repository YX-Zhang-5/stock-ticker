        /* 优化字体加载 */

</head>
<body class="min-h-screen w-full p-2 select-none relative bg-gray-900 text-white smooth-scroll" onclick="toggleUI()">
    <!-- Loading Screen -->
    <div id="loadingScreen" class="fixed inset-0 bg-gray-900 flex items-center justify-center z-50">
        <div class="text-center">
            <div class="loading-spinner w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full mx-auto mb-4"></div>
            <p class="text-gray-400">加载中...</p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="mx-auto h-full w-full max-w-7xl flex flex-col items-center justify-start pt-4">
        <!-- Name / Ticker -->
        <div class="w-full overflow-hidden mb-2">
            <div id="stockName" class="text-center font-semibold tracking-tight text-[12vmin] mobile-optimized" title="AAPL">
                Apple Inc.
            </div>
        </div>

        <!-- Price big -->
        <div id="stockPrice" class="text-center font-black leading-none text-[35vmin] text-gray-400">
            --
        </div>

        <!-- Change info -->
        <div class="flex justify-center gap-4 text-[8vmin] mb-4">
            <span id="stockChange" class="text-gray-400">--</span>
            <span id="stockPct" class="text-gray-400">--</span>
        </div>

        <!-- Last update -->
        <div id="lastUpdate" class="text-center text-gray-400 text-sm mb-8">
            点击刷新按钮获取最新数据
        </div>

        <!-- Control Buttons -->
        <div id="controlButtons" class="absolute top-4 right-4 flex gap-2 z-10 hidden">
            <button id="refreshBtn" onclick="refreshStockData(event)" class="px-3 py-2 rounded-lg text-sm font-medium bg-orange-500 text-white hover:bg-orange-600 transition-colors">
                🔄 刷新
            </button>
            <button id="watchlistBtn" onclick="toggleWatchlist(event)" class="px-3 py-2 rounded-lg text-sm font-medium transition-colors bg-blue-500 text-white hover:bg-blue-600">
                ☆ 关注
            </button>
            <button onclick="showWatchList(event)" class="px-3 py-2 rounded-lg text-sm font-medium bg-gray-500 text-white hover:bg-gray-600 transition-colors">
                📋 列表
            </button>
            <button onclick="showSearchModal()" class="px-3 py-2 rounded-lg text-sm font-medium bg-green-500 text-white hover:bg-green-600 transition-colors">
                🔍 搜索
            </button>
            <button onclick="toggleRealtime()" class="px-3 py-2 rounded-lg text-sm font-medium bg-purple-500 text-white hover:bg-purple-600 transition-colors">
                📡 实时
            </button>
            <button onclick="hideUI()" class="px-3 py-2 rounded-lg text-sm font-medium bg-gray-700 text-white hover:bg-gray-800 transition-colors">
                ✕
            </button>
        </div>
    </div>

    <!-- Watch List Modal -->
    <div id="watchListModal" class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center z-20 hidden">
        <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4 max-h-[80vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-800">关注列表</h2>
                <button onclick="hideWatchList()" class="text-gray-500 hover:text-gray-700 text-xl">
                    ✕
                </button>
            </div>
            <div id="watchListContent">
                <!-- Dynamic content -->
            </div>
        </div>
    </div>

    <!-- Search Stock Modal -->
    <div id="searchModal" class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center z-20 hidden">
        <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4 max-h-[80vh] overflow-y-auto">

                <h2 class="text-xl font-bold text-gray-800">搜索股票</h2>

                    ×

            <!-- Search Input -->
            <div class="mb-4">

                    type="text" 
                    id="searchInput" 
                    placeholder="输入股票代码或名称 (如: AAPL, Apple, 苹果)"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-900 bg-white"

            <!-- Search Results -->
            <div id="searchResults" class="space-y-2">

            <!-- Popular Stocks -->
            <div class="mt-6">
                <h3 class="text-sm font-semibold text-gray-700 mb-2">热门股票</h3>

                    <button onclick="addPopularStock('TSLA', 'Tesla Inc.')" class="p-2 text-left bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">
                        <div class="font-medium text-sm">🚗 Tesla</div>
                        <div class="text-xs text-gray-600">TSLA</div>
                    </button>
                    <button onclick="addPopularStock('MSFT', 'Microsoft Corporation')" class="p-2 text-left bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">
                        <div class="font-medium text-sm">🪟 Microsoft</div>

                    </button>
                    <button onclick="addPopularStock('NVDA', 'NVIDIA Corporation')" class="p-2 text-left bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">

    <!-- Error Message -->
    <div id="errorMessage" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-red-500 text-white px-4 py-2 rounded-lg z-30 hidden">
        <span id="errorText"></span>
    </div>

    <!-- Success Message -->

    <!-- Main Application Script -->
    <script>
        // ========================================
        // 🚀 Finnhub API配置说明
        // ========================================
        // 
        // 📊 Finnhub API：
        // - 免费版：每分钟60次调用
        // - 付费版：$9/月起，提供更高限制
        // - 官网：https://finnhub.io/pricing
        // 
        // 💡 特点：
        // - 稳定可靠的数据源
        // - 支持全球股票市场
        // - 实时价格数据
        // ========================================
        
        // 全局变量
        let currentStock = { name: 'Apple Inc.', price: 150.25, symbol: 'AAPL' };
        let watchList = [];
        let showUI = false;
        let searchTimeout = null;
        
        // 数据缓存
        let lastSuccessfulData = null;
        let lastUpdateTime = null;
        
        // 多API配置 - 只使用Finnhub
        const API_CONFIGS = {
            finnhub: {
                key: 'd3pfd89r01qq6ml8in9gd3pfd89r01qq6ml8ina0', // 🔑 请替换为您的 Finnhub API Key
                name: 'Finnhub',
                rateLimit: { calls: 60, period: 60000 }, // 每分钟60次
                priority: 1
            }
        };
        
        let isRealtime = false;
        let updateInterval = null;
        let lastApiCall = 0;
        const API_CALL_INTERVAL = 5000; // 5秒间隔，更频繁的调用
        let apiCallCount = 0;
        const MAX_API_CALLS_PER_MINUTE = 15; // 增加总调用次数

        // 股票数据库
        const STOCK_DATABASE = {
            'AAPL': { name: 'Apple Inc.', symbol: 'AAPL', category: '科技' },
            'TSLA': { name: 'Tesla Inc.', symbol: 'TSLA', category: '汽车' },
            'MSFT': { name: 'Microsoft Corporation', symbol: 'MSFT', category: '科技' },
            'NVDA': { name: 'NVIDIA Corporation', symbol: 'NVDA', category: '科技' },
            'GOOGL': { name: 'Alphabet Inc.', symbol: 'GOOGL', category: '科技' },
            'AMZN': { name: 'Amazon.com Inc.', symbol: 'AMZN', category: '电商' },
            'META': { name: 'Meta Platforms Inc.', symbol: 'META', category: '科技' },
            'NFLX': { name: 'Netflix Inc.', symbol: 'NFLX', category: '媒体' },
            'DIS': { name: 'The Walt Disney Company', symbol: 'DIS', category: '媒体' },
            'BABA': { name: 'Alibaba Group Holding Limited', symbol: 'BABA', category: '电商' },
            'JD': { name: 'JD.com Inc.', symbol: 'JD', category: '电商' },
            'BIDU': { name: 'Baidu Inc.', symbol: 'BIDU', category: '科技' },
            'NIO': { name: 'NIO Inc.', symbol: 'NIO', category: '汽车' },
            'XPEV': { name: 'XPeng Inc.', symbol: 'XPEV', category: '汽车' },
            'LI': { name: 'Li Auto Inc.', symbol: 'LI', category: '汽车' },
            'PDD': { name: 'PDD Holdings Inc.', symbol: 'PDD', category: '电商' },
            'TME': { name: 'Tencent Music Entertainment Group', symbol: 'TME', category: '媒体' },
            'VIPS': { name: 'Vipshop Holdings Limited', symbol: 'VIPS', category: '电商' },
            'WMT': { name: 'Walmart Inc.', symbol: 'WMT', category: '零售' },
            'JPM': { name: 'JPMorgan Chase & Co.', symbol: 'JPM', category: '金融' },
            'BAC': { name: 'Bank of America Corporation', symbol: 'BAC', category: '金融' },
            'WFC': { name: 'Wells Fargo & Company', symbol: 'WFC', category: '金融' },
            'GS': { name: 'Goldman Sachs Group Inc.', symbol: 'GS', category: '金融' },
            'JNJ': { name: 'Johnson & Johnson', symbol: 'JNJ', category: '医疗' },
            'PFE': { name: 'Pfizer Inc.', symbol: 'PFE', category: '医疗' },
            'UNH': { name: 'UnitedHealth Group Incorporated', symbol: 'UNH', category: '医疗' },
            'KO': { name: 'The Coca-Cola Company', symbol: 'KO', category: '饮料' },
            'PEP': { name: 'PepsiCo Inc.', symbol: 'PEP', category: '饮料' },
            'MCD': { name: 'McDonald\'s Corporation', symbol: 'MCD', category: '餐饮' },
            'SBUX': { name: 'Starbucks Corporation', symbol: 'SBUX', category: '餐饮' }
        };

        // 初始化应用
        document.addEventListener('DOMContentLoaded', function() {
            initializeApp();
        });

        function initializeApp() {
            // 隐藏加载屏幕
            setTimeout(() => {
                document.getElementById('loadingScreen').style.display = 'none';
            }, 1000);

            // 初始化显示状态
            initializeDisplay();
            
            // 加载关注列表
            loadWatchList();
            
            // 检查URL参数
            checkURLParams();
            
            // 初始化UI
            updateWatchListButton();
            
            // 自动加载初始数据
            loadInitialData();
            
            console.log('✅ 应用初始化完成，正在加载初始数据');
        }

        // 初始化显示状态
        function initializeDisplay() {
            // 确保显示正确的初始状态
            document.getElementById('stockName').textContent = 'Apple Inc.';
            document.getElementById('stockPrice').textContent = '--';
            document.getElementById('stockChange').textContent = '--';
            document.getElementById('stockPct').textContent = '--';
            document.getElementById('lastUpdate').textContent = '正在加载初始数据...';
            
            // 设置初始颜色为灰色
            document.getElementById('stockPrice').style.color = '#9ca3af';
            document.getElementById('stockChange').style.color = '#9ca3af';
            document.getElementById('stockPct').style.color = '#9ca3af';
        }

        // 加载初始数据
        async function loadInitialData() {
            try {
                // 显示加载状态
                document.getElementById('lastUpdate').textContent = '正在加载初始数据...';
                
                // 等待一小段时间确保页面完全加载
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // 加载当前股票的数据
                await loadStockData(currentStock.symbol);
                
                console.log('✅ 初始数据加载完成');
                
            } catch (error) {
                console.error('初始数据加载失败:', error);
                // 如果初始加载失败，保持"--"状态
                document.getElementById('lastUpdate').textContent = '初始数据加载失败，请手动刷新';
            }
        }

        // 检查URL参数
        function checkURLParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const symbol = urlParams.get('symbol');
            
            if (symbol) {
                const stock = STOCK_DATABASE[symbol.toUpperCase()];
                if (stock) {
                    currentStock = { name: stock.name, price: 0, symbol: stock.symbol };
                    document.getElementById('stockName').textContent = stock.name;
                    document.getElementById('stockPrice').textContent = '--';
                    document.getElementById('stockChange').textContent = '--';
                    document.getElementById('stockPct').textContent = '--';
                    document.getElementById('lastUpdate').textContent = '正在加载数据...';
                }
            }
        }

        // 智能多API轮换系统
        async function fetchStockData(symbol, retryCount = 0) {
            const MAX_RETRIES = 2;
            const RETRY_DELAY = 1000; // 1秒重试延迟
            
            try {
                // 检查API调用频率限制
                const now = Date.now();
                if (now - lastApiCall < API_CALL_INTERVAL) {
                    const remainingTime = Math.ceil((API_CALL_INTERVAL - (now - lastApiCall)) / 1000);
                    console.log(`API调用过于频繁，请等待 ${remainingTime} 秒`);
                    return null;
                }
                
                // 检查每分钟调用次数限制
                if (apiCallCount >= MAX_API_CALLS_PER_MINUTE) {
                    console.log('已达到每分钟API调用限制，请稍后重试');
                    return null;
                }
                
                lastApiCall = now;
                apiCallCount++;
                
                // 每分钟重置计数器
                setTimeout(() => {
                    apiCallCount = Math.max(0, apiCallCount - 1);
                }, 60000);

                console.log(`🔄 正在调用API: ${symbol} (尝试 ${retryCount + 1}/${MAX_RETRIES + 1})`);
                
                // 智能选择API源（按优先级和可用性）
                const apiSources = getAvailableApiSources();
                
                // 尝试每个API源
                for (let i = 0; i < apiSources.length; i++) {
                    const source = apiSources[i];
                    try {
                        console.log(`🔄 尝试 ${source.name} API`);
                        
                        const response = await fetch(source.url, {
                            method: 'GET',
                            headers: {
                                'Accept': 'application/json',
                            },
                            // 添加超时控制
                            signal: AbortSignal.timeout(8000) // 8秒超时
                        });
                        
                        if (!response.ok) {
                            throw new Error(`${source.name} HTTP error! status: ${response.status}`);
                        }
                        
                        const data = await response.json();
                        const result = source.parser(data, symbol);
                        
                        if (result) {
                            console.log(`✅ ${source.name} API调用成功: ${symbol}`);
                            // 记录成功的API，下次优先使用
                            recordApiSuccess(source.name);
                            return result;
                        }
                        
                    } catch (error) {
                        console.warn(`${source.name} API失败:`, error.message);
                        // 记录失败的API
                        recordApiFailure(source.name);
                        if (i === apiSources.length - 1) {
                            throw error; // 最后一个API也失败了
                        }
                    }
                }
                
                // 如果所有API都失败，使用缓存数据或模拟数据
                if (lastSuccessfulData) {
                    console.log('⚠️ API失败，使用缓存数据');
                    return {
                        ...lastSuccessfulData,
                        timestamp: new Date().toLocaleString(),
                        source: '缓存数据 (API不可用)'
                    };
                } else {
                    console.log('⚠️ 所有API都失败，使用模拟数据作为备用');
                    return generateFallbackData(symbol);
                }
                
            } catch (error) {
                console.error(`API调用失败 (尝试 ${retryCount + 1}):`, error.message);
                
                // 重试逻辑
                if (retryCount < MAX_RETRIES) {
                    console.log(`⏳ ${RETRY_DELAY/1000}秒后重试...`);
                    await new Promise(resolve => setTimeout(resolve, RETRY_DELAY));
                    return fetchStockData(symbol, retryCount + 1);
                }
                
                // 最终失败，使用缓存数据或模拟数据
                if (lastSuccessfulData) {
                    console.log('⚠️ 所有重试都失败，使用缓存数据');
                    return {
                        ...lastSuccessfulData,
                        timestamp: new Date().toLocaleString(),
                        source: '缓存数据 (API不可用)'
                    };
                } else {
                    console.log('⚠️ 所有重试都失败，使用模拟数据作为备用');
                    return generateFallbackData(symbol);
                }
            }
        }

        // 获取可用的API源（只使用Finnhub）
        function getAvailableApiSources() {
            const sources = [];
            
            // 只使用Finnhub
            if (API_CONFIGS.finnhub.key && API_CONFIGS.finnhub.key !== 'demo') {
                sources.push({
                    name: 'Finnhub',
                    url: `https://finnhub.io/api/v1/quote?symbol=${currentStock.symbol}&token=${API_CONFIGS.finnhub.key}`,
                    parser: parseFinnhubResponse,
                    priority: API_CONFIGS.finnhub.priority
                });
            }
            
            return sources;
        }

        // API成功/失败记录
        const apiStats = {};
        
        function recordApiSuccess(apiName) {
            if (!apiStats[apiName]) {
                apiStats[apiName] = { success: 0, failure: 0 };
            }
            apiStats[apiName].success++;
        }
        
        function recordApiFailure(apiName) {
            if (!apiStats[apiName]) {
                apiStats[apiName] = { success: 0, failure: 0 };
            }
            apiStats[apiName].failure++;
        }


        // Finnhub API响应解析器
        function parseFinnhubResponse(data, symbol) {
            if (!data.c || !data.pc) {
                throw new Error('Finnhub: 无效的API响应');
            }
            
            const price = data.c;
            const previousClose = data.pc;
            const change = price - previousClose;
            const changePercent = (change / previousClose) * 100;
            
            return {
                symbol: symbol,
                price: price,
                change: change,
                changePercent: changePercent,
                open: data.o || price,
                high: data.h || price,
                low: data.l || price,
                volume: 0, // Finnhub不提供成交量
                previousClose: previousClose,
                timestamp: new Date().toLocaleString(),
                source: 'Finnhub'
            };
        }

        // 生成备用数据（当所有API都失败时）
        function generateFallbackData(symbol) {
            const stockInfo = STOCK_DATABASE[symbol] || { name: symbol, basePrice: 100.00 };
            const basePrice = stockInfo.basePrice || 100.00;
            
            // 生成随机波动
            const volatility = 0.02;
            const changePercent = (Math.random() - 0.5) * volatility * 100;
            const change = (basePrice * changePercent) / 100;
            const price = basePrice + change;
            
            return {
                symbol: symbol,
                price: parseFloat(price.toFixed(2)),
                change: parseFloat(change.toFixed(2)),
                changePercent: parseFloat(changePercent.toFixed(2)),
                open: parseFloat((basePrice + (Math.random() - 0.5) * basePrice * 0.01).toFixed(2)),
                high: parseFloat((price + Math.random() * basePrice * 0.01).toFixed(2)),
                low: parseFloat((price - Math.random() * basePrice * 0.01).toFixed(2)),
                volume: Math.floor(10000000 * (1 + Math.abs(changePercent) * 10)),
                previousClose: basePrice,
                timestamp: new Date().toLocaleString(),
                source: '模拟数据 (API不可用)'
            };
        }

        // 显示API错误信息（使用缓存数据）
        function showApiError() {
            const now = Date.now();
            const timeSinceLastCall = now - lastApiCall;
            const remainingTime = Math.ceil((API_CALL_INTERVAL - timeSinceLastCall) / 1000);
            
            // 如果有缓存数据，使用缓存数据并显示提示
            if (lastSuccessfulData && lastUpdateTime) {
                const timeDiff = Math.floor((now - lastUpdateTime.getTime()) / 1000);
                const minutes = Math.floor(timeDiff / 60);
                const seconds = timeDiff % 60;
                const timeText = minutes > 0 ? `${minutes}分${seconds}秒前` : `${seconds}秒前`;
                
                // 使用缓存数据更新显示
                updateDisplayWithCachedData();
                
                // 显示错误提示
                document.getElementById('lastUpdate').textContent = `⚠️ API调用失败，显示${timeText}的数据`;
                document.getElementById('lastUpdate').style.color = '#f59e0b';
                
                // 显示错误消息
                showMessage(`API调用失败，显示${timeText}的缓存数据`, 'error');
                return;
            }
            
            // 没有缓存数据时的处理
            if (timeSinceLastCall < API_CALL_INTERVAL) {
                document.getElementById('lastUpdate').textContent = `⏳ 请等待 ${remainingTime} 秒后重试`;
                document.getElementById('lastUpdate').style.color = '#f59e0b';
            } else if (apiCallCount >= MAX_API_CALLS_PER_MINUTE) {
                document.getElementById('lastUpdate').textContent = '⏳ 已达到每分钟API限制，请稍后重试';
                document.getElementById('lastUpdate').style.color = '#f59e0b';
            } else {
                document.getElementById('lastUpdate').textContent = '❌ 无法获取数据，请检查网络连接或稍后重试';
                document.getElementById('lastUpdate').style.color = '#ef4444';
            }

            showMessage('无法获取股票数据，请稍后重试', 'error');
        }

        // Watch list 功能 - 增强版
        function loadWatchList() {
            try {
                // 1. 优先从 LocalStorage 加载
                const saved = localStorage.getItem('stockWatchList');
                if (saved) {
                    watchList = JSON.parse(saved);
                    console.log('✅ 从 LocalStorage 加载关注列表');
                    return;
                }
                
                // 2. 尝试从 URL 参数加载
                const urlParams = new URLSearchParams(window.location.search);
                const urlWatchList = urlParams.get('watchlist');
                if (urlWatchList) {
                    try {
                        watchList = JSON.parse(decodeURIComponent(urlWatchList));
                        console.log('✅ 从 URL 参数加载关注列表');
                        // 保存到 LocalStorage 以便下次使用
                        saveWatchList();
                        return;
                    } catch (e) {
                        console.warn('URL 参数解析失败:', e);
                    }
                }
                
                // 3. 尝试从 Cookie 加载
                const cookies = document.cookie.split(';');
                const watchlistCookie = cookies.find(cookie => cookie.trim().startsWith('watchlist='));
                if (watchlistCookie) {
                    try {
                        const cookieData = watchlistCookie.split('=')[1];
                        watchList = JSON.parse(decodeURIComponent(cookieData));
                        console.log('✅ 从 Cookie 加载关注列表');
                        // 保存到 LocalStorage 以便下次使用
                        saveWatchList();
                        return;
                    } catch (e) {
                        console.warn('Cookie 解析失败:', e);
                    }
                }
                
                console.log('ℹ️ 未找到保存的关注列表，使用空列表');
            } catch (e) {
                console.error('Failed to load watch list:', e);
            }
        }

        function saveWatchList() {
            try {
                // 1. 保存到 LocalStorage (主要存储)
                localStorage.setItem('stockWatchList', JSON.stringify(watchList));
                
                // 2. 保存到 Cookie (备份，7天过期)
                const cookieData = encodeURIComponent(JSON.stringify(watchList));
                if (cookieData.length < 4000) { // Cookie 大小限制
                    document.cookie = `watchlist=${cookieData}; max-age=604800; path=/`;
                }
                
                // 3. 更新 URL 参数 (如果数据不太大)
                const urlData = encodeURIComponent(JSON.stringify(watchList));
                if (urlData.length < 1000) { // URL 长度限制
                    const url = new URL(window.location);
                    url.searchParams.set('watchlist', urlData);
                    window.history.replaceState({}, '', url);
                }
                
                console.log('✅ 关注列表已保存到多种存储方式');
            } catch (e) {
                console.error('Failed to save watch list:', e);
            }
        }

        // 文件导入/导出功能
        function exportWatchList() {
            try {
                const dataStr = JSON.stringify(watchList, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                
                const link = document.createElement('a');
                link.href = url;
                link.download = `stock-watchlist-${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                
                console.log('✅ 关注列表已导出');
                showMessage('关注列表已导出', 'success');
            } catch (e) {
                console.error('导出失败:', e);
                showMessage('导出失败，请重试', 'error');
            }
        }

        function importWatchList() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = function(event) {
                const file = event.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        if (Array.isArray(importedData)) {
                            // 合并导入的数据，避免重复
                            const existingSymbols = watchList.map(stock => stock.symbol);
                            const newStocks = importedData.filter(stock => !existingSymbols.includes(stock.symbol));
                            watchList = [...watchList, ...newStocks];
                            saveWatchList();
                            updateWatchListDisplay();
                            console.log(`✅ 成功导入 ${newStocks.length} 个新股票`);
                            showMessage(`成功导入 ${newStocks.length} 个新股票`, 'success');
                        } else {
                            throw new Error('文件格式不正确');
                        }
                    } catch (error) {
                        console.error('导入失败:', error);
                        showMessage('导入失败：文件格式不正确', 'error');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function searchStocks(query) {
            if (!query || query.length < 1) {
                return [];
            }
            
            const results = [];
            const lowerQuery = query.toLowerCase();
            
            for (const [symbol, stock] of Object.entries(STOCK_DATABASE)) {
                const symbolMatch = symbol.toLowerCase().includes(lowerQuery);
                const nameMatch = stock.name.toLowerCase().includes(lowerQuery);
                
                if (symbolMatch || nameMatch) {
                    results.push({
                        ...stock,
                        matchType: symbolMatch ? 'symbol' : 'name',
                        matchScore: symbolMatch ? 2 : 1
                    });
                }
            }
            
            return results.sort((a, b) => {
                if (a.matchScore !== b.matchScore) {
                    return b.matchScore - a.matchScore;
                }
                return a.name.localeCompare(b.name);
            });
        }

        function handleSearchInput(event) {
            const query = event.target.value.trim();
            
            if (searchTimeout) {
                clearTimeout(searchTimeout);
            }
            
            searchTimeout = setTimeout(() => {
                const results = searchStocks(query);
                displaySearchResults(results);
            }, 300);
        }

            if (results.length === 0) {
                container.innerHTML = '<div class="text-gray-500 text-center py-4">未找到匹配的股票</div>';
                return;

            container.innerHTML = results.map(stock => `
                <div class="p-3 bg-gray-100 hover:bg-gray-200 rounded-lg cursor-pointer transition-colors" onclick="addStockFromSearch('${stock.symbol}', '${stock.name}')">
                    <div class="font-semibold text-gray-800">${stock.name}</div>
                    <div class="text-sm text-gray-600">${stock.symbol} • ${stock.category}</div>
                </div>
            `).join('');
        }

        // 刷新关注列表中所有股票的价格
        async function refreshAllWatchListStocks() {
            if (watchList.length === 0) {
                showMessage('关注列表为空', 'error');
                return;
            }

            const refreshBtn = document.querySelector('button[onclick="refreshAllWatchListStocks()"]');
            const originalText = refreshBtn.textContent;
            
            // 显示加载状态
            refreshBtn.textContent = '⏳ 刷新中...';
            refreshBtn.disabled = true;
            
            let successCount = 0;
            let failCount = 0;
            
            try {
                // 为每个股票获取最新价格
                for (const stock of watchList) {
                    try {
                        const data = await fetchStockData(stock.symbol);
                        if (data) {
                            updateWatchListStockPrice(stock.symbol, data.price, data.change, data.changePercent);
                            successCount++;
                        } else {
                            failCount++;
                        }
                        
                        // 添加延迟避免API限制
                        await new Promise(resolve => setTimeout(resolve, 2000));
                        
                    } catch (error) {
                        console.error(`刷新 ${stock.symbol} 失败:`, error);
                        failCount++;
                    }
                }
                
                // 更新显示
                updateWatchListDisplay();
                
                // 显示结果
                if (successCount > 0) {
                    showMessage(`成功刷新 ${successCount} 个股票${failCount > 0 ? `，${failCount} 个失败` : ''}`, 'success');
                } else {
                    showMessage('所有股票刷新失败，请稍后重试', 'error');
                }
                
            } catch (error) {
                console.error('刷新关注列表失败:', error);
                showMessage('刷新失败，请稍后重试', 'error');
            } finally {
                // 恢复按钮状态
                refreshBtn.textContent = originalText;
                refreshBtn.disabled = false;
            }
        }

        // 显示消息
        function showMessage(message, type = 'success') {
            const messageElement = type === 'success' ? 
                document.getElementById('successMessage') : 
                document.getElementById('errorMessage');
            const textElement = type === 'success' ? 
                document.getElementById('successText') : 
                document.getElementById('errorText');
            
            textElement.textContent = message;
            messageElement.classList.remove('hidden');
            
            setTimeout(() => {
                messageElement.classList.add('hidden');
            }, 3000);
        }

        // UI 控制
        function toggleUI() {
            showUI = !showUI;
            if (showUI) {
                document.getElementById('controlButtons').classList.remove('hidden');
                updateWatchListButton();
            } else {
                document.getElementById('controlButtons').classList.add('hidden');
            }
        }

        function hideUI() {
            if (event) event.stopPropagation();
            showUI = false;
            document.getElementById('controlButtons').classList.add('hidden');
        }

        function updateWatchListButton() {
            const btn = document.getElementById('watchlistBtn');
            if (isInWatchList()) {
                btn.textContent = '★ 已关注';
                btn.className = 'px-3 py-2 rounded-lg text-sm font-medium transition-colors bg-red-500 text-white hover:bg-red-600';
            } else {
                btn.textContent = '☆ 关注';
                btn.className = 'px-3 py-2 rounded-lg text-sm font-medium transition-colors bg-blue-500 text-white hover:bg-blue-600';
            }
        }


        // 错误处理
        window.addEventListener('error', function(e) {
            console.error('Global error:', e.error);
            showMessage('发生错误，请刷新页面重试', 'error');
        });

        // 性能监控
        window.addEventListener('load', function() {
            // 记录页面加载时间
            const loadTime = performance.now();
            console.log(`页面加载时间: ${loadTime.toFixed(2)}ms`);
            
            // 发送性能数据到分析服务
            if (typeof gtag !== 'undefined') {
                gtag('event', 'page_load_time', {
                    'value': Math.round(loadTime)
                });
            }
        });
    </script>
</body>
</html>
