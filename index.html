<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=3.0, user-scalable=yes">
    <title>股票实时行情 - Stock Ticker</title>
    <meta name="description" content="实时股票行情显示，支持关注列表、搜索功能，无需登录即可使用">
    <meta name="keywords" content="股票,行情,实时,关注列表,投资">
    <meta name="author" content="Stock Ticker App">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://your-domain.com/">
    <meta property="og:title" content="股票实时行情 - Stock Ticker">
    <meta property="og:description" content="实时股票行情显示，支持关注列表、搜索功能">
    <meta property="og:image" content="https://your-domain.com/og-image.jpg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://your-domain.com/">
    <meta property="twitter:title" content="股票实时行情 - Stock Ticker">
    <meta property="twitter:description" content="实时股票行情显示，支持关注列表、搜索功能">
    <meta property="twitter:image" content="https://your-domain.com/og-image.jpg">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Styles -->
    <style>
        /* 优化字体加载 */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        /* 优化动画性能 */
        * {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* 加载动画 */
        .loading-spinner {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* 优化滚动 */
        .smooth-scroll {
            scroll-behavior: smooth;
        }
        
        /* 响应式优化 */
        @media (max-width: 768px) {
            .mobile-optimized {
                font-size: clamp(1rem, 4vw, 1.5rem);
            }
        }
        
        /* 移动端横屏模式样式 - 强制隐藏状态栏版本 */
        .mobile-landscape {
            /* 强制全屏，隐藏状态栏 */
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            overflow: hidden !important;
            background-color: #111827;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0;
            box-sizing: border-box;
            margin: 0 !important;
            z-index: 9999;
        }
        
        /* 强制隐藏状态栏 */
        .mobile-landscape body {
            overflow: hidden !important;
            position: fixed !important;
            width: 100vw !important;
            height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
        }
        
        /* 隐藏浏览器地址栏和状态栏 */
        .mobile-landscape html {
            overflow: hidden !important;
            height: 100vh !important;
        }
        
        /* 防止状态栏显示 */
        @media screen and (max-height: 500px) {
            .mobile-landscape {
                height: 100vh !important;
                min-height: 100vh !important;
            }
        }
        
        /* 隐藏浏览器UI */
        .mobile-landscape::-webkit-scrollbar {
            display: none !important;
        }
        
        .mobile-landscape {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }
        
        /* 强制隐藏地址栏 */
        .mobile-landscape {
            -webkit-overflow-scrolling: touch !important;
        }
        
        /* 防止页面滚动 */
        .mobile-landscape * {
            -webkit-overflow-scrolling: touch !important;
        }
        
        /* 主要内容区域 - 居中显示，向上移动 */
        .mobile-landscape .mx-auto {
            max-width: none;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 20px 0 0 0;
            text-align: center;
            position: relative;
        }
        
        /* 股票名称调整 - 放大到原来的两倍 */
        .mobile-landscape #stockName {
            font-size: clamp(12vmin, 16vw, 20vmin) !important;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.1;
            max-width: 100%;
            font-weight: 600;
        }
        
        /* 股票价格调整 - 放大一倍 */
        .mobile-landscape #stockPrice {
            font-size: clamp(24vmin, 30vw, 36vmin) !important;
            margin-bottom: 20px;
            text-align: center;
            line-height: 0.9;
            max-width: 100%;
            font-weight: 900;
            letter-spacing: -0.01em;
            word-break: break-all;
        }
        
        /* 变化信息容器调整 - 居中显示 */
        .mobile-landscape .flex.justify-center.gap-4 {
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            width: 100%;
        }
        
        /* 变化信息文字调整 - 放大一倍 */
        .mobile-landscape #stockChange,
        .mobile-landscape #stockPct {
            font-size: clamp(6vmin, 7vw, 8vmin) !important;
            text-align: center;
            line-height: 1.1;
            font-weight: 700;
        }
        
        /* 更新时间调整 - 减小到原来的0.5倍，向上移动 */
        .mobile-landscape #lastUpdate {
            font-size: clamp(2vmin, 2.5vw, 3vmin) !important;
            margin-bottom: -10px;
            text-align: center;
            line-height: 1.2;
            max-width: 100%;
            opacity: 0.8;
            font-weight: 500;
        }
        
        /* 菜单按钮在横屏模式下的样式 */
        .mobile-landscape #menuButton {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1000;
        }
        
        .mobile-landscape #menuButton button {
            width: auto;
            min-width: 60px;
            padding: 8px 12px;
            font-size: clamp(10px, 2.2vw, 12px);
            border-radius: 6px;
            white-space: nowrap;
            text-align: center;
            min-height: 32px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        
        /* 控制菜单在横屏模式下的样式 */
        .mobile-landscape #controlMenu {
            position: fixed;
            top: 50px;
            right: 10px;
            z-index: 1001;
            width: auto;
            max-width: 90vw;
        }
        
        .mobile-landscape #controlMenu button {
            font-size: clamp(10px, 2.2vw, 12px);
            padding: 6px 10px;
            min-height: 28px;
            width: auto;
            white-space: nowrap;
        }
        
        /* 左右切换按钮在横屏模式下的样式 */
        .mobile-landscape #prevBtn,
        .mobile-landscape #nextBtn {
            position: fixed !important;
            width: 50px !important;
            height: 50px !important;
            border-radius: 50% !important;
            font-size: clamp(16px, 3vw, 20px) !important;
            padding: 0 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            z-index: 1001 !important;
            background: transparent !important;
            color: white !important;
            border: 2px solid rgba(255, 255, 255, 0.3) !important;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2) !important;
        }
        
        .mobile-landscape #prevBtn:hover,
        .mobile-landscape #nextBtn:hover {
            background: rgba(255, 255, 255, 0.1) !important;
            border-color: rgba(255, 255, 255, 0.5) !important;
        }
        
        .mobile-landscape #prevBtn {
            left: 15px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
        }
        
        .mobile-landscape #nextBtn {
            right: 15px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
        }
        
        /* 横屏模式下的模态框调整 */
        .mobile-landscape #watchListModal,
        .mobile-landscape #searchModal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90vw;
            height: 80vh;
            max-width: 800px;
            max-height: 600px;
            z-index: 2000;
        }
        
        .mobile-landscape #watchListModal .bg-white,
        .mobile-landscape #searchModal .bg-white {
            height: 100%;
            border-radius: 12px;
        }
        
        /* 移动端滚动优化 - 针对真实移动设备 */
        #watchListContent {
            -webkit-overflow-scrolling: touch !important;
            overflow-y: scroll !important;
            overflow-x: hidden !important;
            scrollbar-width: none !important;
            -ms-overflow-style: none !important;
            touch-action: pan-y !important;
            overscroll-behavior: contain !important;
            position: relative !important;
            z-index: 1 !important;
            /* 移动端特殊处理 */
            transform: translateZ(0) !important;
            -webkit-transform: translateZ(0) !important;
            will-change: scroll-position !important;
        }
        
        /* 确保父容器不阻止滚动 */
        #watchListModal .bg-white {
            overflow: visible !important;
            position: relative !important;
            /* 移动端特殊处理 */
            transform: translateZ(0) !important;
            -webkit-transform: translateZ(0) !important;
        }
        
        /* 隐藏滚动条但保持滚动功能 */
        #watchListContent::-webkit-scrollbar {
            display: none !important;
        }
        
        /* 确保模态框容器不阻止滚动 */
        #watchListModal {
            touch-action: none;
        }
        
        #watchListModal .bg-white {
            touch-action: auto;
        }
        
        /* 移动端横屏模式滚动优化 */
        .mobile-landscape #watchListContent {
            -webkit-overflow-scrolling: touch !important;
            overflow-y: scroll !important;
            overflow-x: hidden !important;
            scrollbar-width: none !important;
            -ms-overflow-style: none !important;
            touch-action: pan-y !important;
            overscroll-behavior: contain !important;
            transform: translateZ(0) !important;
            -webkit-transform: translateZ(0) !important;
            will-change: scroll-position !important;
        }
        
        .mobile-landscape #watchListContent::-webkit-scrollbar {
            display: none !important;
        }
        
        /* 横屏模式下的模态框内容调整 */
        .mobile-landscape #watchListModal .flex-shrink-0 {
            padding: 20px 20px 16px 20px;
        }
        
        .mobile-landscape #watchListContent {
            padding: 0 20px 20px 20px;
        }

        /* 移动端横屏模式滚动按钮样式 */
        .mobile-landscape #scrollUpBtn,
        .mobile-landscape #scrollDownBtn {
            width: 36px;
            height: 36px;
            font-size: 16px;
        }

        .mobile-landscape .flex.justify-center.space-x-4 {
            padding: 12px 16px;
        }
        
        .mobile-landscape #searchModal .p-6 {
            padding: 20px;
        }
        
        .mobile-landscape #watchListModal h2,
        .mobile-landscape #searchModal h2 {
            font-size: clamp(18px, 4vw, 24px);
            margin-bottom: 20px;
        }
        
        /* 横屏模式下的搜索输入框调整 */
        .mobile-landscape #searchInput {
            font-size: clamp(16px, 3.5vw, 18px);
            padding: 12px 16px;
        }
        
        /* 横屏模式下的股票列表项调整 */
        .mobile-landscape .bg-gray-50 {
            padding: 15px;
            margin-bottom: 12px;
        }
        
        .mobile-landscape .bg-gray-50 .font-semibold {
            font-size: clamp(16px, 3.5vw, 18px);
        }
        
        .mobile-landscape .bg-gray-50 .text-sm {
            font-size: clamp(14px, 3vw, 16px);
        }
        
        .mobile-landscape .bg-gray-50 .text-lg {
            font-size: clamp(18px, 4vw, 20px);
        }
        
        /* 隐藏移动端横屏模式的滚动条 */
        .mobile-landscape::-webkit-scrollbar {
            display: none;
        }
        
        .mobile-landscape {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* 横屏模式下的消息提示调整 */
        .mobile-landscape #errorMessage,
        .mobile-landscape #successMessage {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: clamp(14px, 3vw, 16px);
            padding: 10px 20px;
            border-radius: 8px;
            z-index: 3000;
            max-width: 80vw;
            text-align: center;
        }
        
        /* 横屏模式下的加载屏幕调整 */
        .mobile-landscape #loadingScreen {
            transform: none;
        }
        
        .mobile-landscape #loadingScreen .loading-spinner {
            width: 50px;
            height: 50px;
        }
        
        .mobile-landscape #loadingScreen p {
            font-size: clamp(16px, 3.5vw, 18px);
        }
        
        /* 移动端优化 - 支持缩放 */
        @media (max-width: 768px) {
            /* 支持缩放功能 */
            * {
                touch-action: auto; /* 允许缩放 */
            }
            
            /* 缩放时的优化 */
            .zoomable {
                transition: transform 0.2s ease-in-out;
            }
            
            /* 缩放提示 */
            .zoom-hint {
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0, 0, 0, 0.8);
                color: white;
                padding: 8px 16px;
                border-radius: 20px;
                font-size: 12px;
                z-index: 1000;
                opacity: 0;
                transition: opacity 0.3s ease;
            }
            
            .zoom-hint.show {
                opacity: 1;
            }
        }
    </style>
</head>
<body class="min-h-screen w-full p-2 relative bg-gray-900 text-white smooth-scroll" onclick="toggleUI()">
    <!-- Loading Screen -->
    <div id="loadingScreen" class="fixed inset-0 bg-gray-900 flex items-center justify-center z-50">
        <div class="text-center">
            <div class="loading-spinner w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full mx-auto mb-4"></div>
            <p class="text-gray-400">加载中...</p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="mx-auto h-full w-full max-w-7xl flex flex-col items-center justify-start pt-2 zoomable">
        <!-- Name / Ticker -->
        <div class="w-full overflow-hidden mb-2">
            <div id="stockName" class="text-center font-semibold tracking-tight text-[12vmin] mobile-optimized" title="AAPL">
                Apple
            </div>
        </div>

        <!-- Price big -->
        <div id="stockPrice" class="text-center font-black leading-none text-[35vmin] text-gray-400">
            --
        </div>

        <!-- Change info -->
        <div class="flex justify-center gap-4 text-[8vmin] mb-4">
            <span id="stockChange" class="text-gray-400">--</span>
            <span id="stockPct" class="text-gray-400">--</span>
        </div>

        <!-- Last update -->
        <div id="lastUpdate" class="text-center text-gray-400 text-sm mb-4">
            正在加载数据...
        </div>

        <!-- Left Navigation Button -->
        <button id="prevBtn" onclick="navigateToPreviousStock()" class="absolute left-4 top-1/2 transform -translate-y-1/2 w-8 h-8 rounded-full text-white hover:bg-white hover:bg-opacity-20 transition-colors z-10 flex items-center justify-center" title="上一只股票">
            ◀
            </button>

        <!-- Right Navigation Button -->
        <button id="nextBtn" onclick="navigateToNextStock()" class="absolute right-4 top-1/2 transform -translate-y-1/2 w-8 h-8 rounded-full text-white hover:bg-white hover:bg-opacity-20 transition-colors z-10 flex items-center justify-center" title="下一只股票">
            ▶
            </button>

        <!-- Menu Button -->
        <div id="menuButton" class="absolute top-4 right-4 z-10 hidden">
            <button onclick="toggleMenu(event)" class="px-4 py-2 rounded-lg text-sm font-medium bg-gray-800 text-white hover:bg-gray-700 transition-colors shadow-lg">
                ☰ 菜单
            </button>
        </div>

        <!-- Control Menu -->
        <div id="controlMenu" class="absolute top-16 right-4 bg-gray-800 rounded-lg shadow-xl z-20 hidden w-auto">
            <div class="p-1 space-y-0.5">
                <button onclick="showWatchList(event)" class="w-auto px-2 py-1 rounded text-xs font-medium bg-gray-500 text-white hover:bg-gray-600 transition-colors text-left whitespace-nowrap">
                📋 列表
            </button>
                <button onclick="showSearchModal()" class="w-auto px-2 py-1 rounded text-xs font-medium bg-green-500 text-white hover:bg-green-600 transition-colors text-left whitespace-nowrap">
                🔍 搜索
            </button>
                <button id="realtimeBtn" onclick="toggleRealtimeData()" class="w-auto px-2 py-1 rounded text-xs font-medium bg-purple-500 text-white hover:bg-purple-600 transition-colors text-left whitespace-nowrap">
                📡 实时更新
            </button>
                <hr class="border-gray-600 my-1">
                <button onclick="hideUI()" class="w-auto px-2 py-1 rounded text-xs font-medium bg-gray-700 text-white hover:bg-gray-600 transition-colors text-left whitespace-nowrap">
                    ✕ 隐藏
            </button>
            </div>
        </div>
    </div>

    <!-- Watch List Modal -->
    <div id="watchListModal" class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center z-20 hidden">
            <div class="bg-white rounded-lg max-w-md w-full mx-4 max-h-[80vh] flex flex-col relative">
                <div class="flex justify-between items-center p-6 pb-4 flex-shrink-0">
                <h2 class="text-xl font-bold text-gray-800">关注列表</h2>
                <button onclick="hideWatchList()" class="text-gray-500 hover:text-gray-700 text-xl">
                    ✕
                </button>
            </div>
                <div id="watchListContent" class="flex-1 overflow-y-auto px-6 pb-6">
                <!-- Dynamic content -->
            </div>
                
                <!-- 滚动按钮 -->
                <div class="flex justify-center space-x-4 p-4 border-t border-gray-200">
                    <button id="scrollUpBtn" onclick="scrollWatchList('up')" class="w-10 h-10 bg-gray-600 text-white rounded-full flex items-center justify-center text-lg hover:bg-gray-700 transition-colors shadow-lg">
                        ↑
                    </button>
                    <button id="scrollDownBtn" onclick="scrollWatchList('down')" class="w-10 h-10 bg-gray-600 text-white rounded-full flex items-center justify-center text-lg hover:bg-gray-700 transition-colors shadow-lg">
                        ↓
                    </button>
            </div>
        </div>
    </div>

    <!-- Search Stock Modal -->
    <div id="searchModal" class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center z-20 hidden">
        <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4 max-h-[80vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-gray-800">搜索股票</h2>
                <button onclick="hideSearchModal()" class="text-gray-500 hover:text-gray-700 text-2xl font-bold">
                    ×
                </button>
            </div>
            
            <!-- Search Input -->
            <div class="mb-4">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="输入股票代码或名称 (如: AAPL, Apple, 苹果)"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-900 bg-white"
                    style="color: #111827 !important; background-color: white !important;"
                    onkeyup="handleSearchInput(event)"
                    oninput="handleSearchInput(event)"
                >
            </div>
            
            <!-- Search Results -->
            <div id="searchResults" class="space-y-2">
                <div class="text-gray-500 text-center py-4">
                    输入股票代码或名称开始搜索
                </div>
            </div>
            
            <!-- Popular Stocks -->
            <div class="mt-6">
                <h3 class="text-sm font-semibold text-gray-700 mb-2">热门股票</h3>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="addPopularStock('AAPL', 'Apple')" class="p-2 text-left bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">
                        <div class="font-medium text-sm">🍎 Apple</div>
                        <div class="text-xs text-gray-600">AAPL</div>
                    </button>
                    <button onclick="addPopularStock('TSLA', 'Tesla')" class="p-2 text-left bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">
                        <div class="font-medium text-sm">🚗 Tesla</div>
                        <div class="text-xs text-gray-600">TSLA</div>
                    </button>
                    <button onclick="addPopularStock('MSFT', 'Microsoft')" class="p-2 text-left bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">
                        <div class="font-medium text-sm">🪟 Microsoft</div>
                        <div class="text-xs text-gray-600">MSFT</div>
                    </button>
                    <button onclick="addPopularStock('NVDA', 'NVIDIA')" class="p-2 text-left bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">
                        <div class="font-medium text-sm">🎮 NVIDIA</div>
                        <div class="text-xs text-gray-600">NVDA</div>
                    </button>
                    <button onclick="addPopularStock('GOOGL', 'Google')" class="p-2 text-left bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">
                        <div class="font-medium text-sm">🔍 Google</div>
                        <div class="text-xs text-gray-600">GOOGL</div>
                    </button>
                    <button onclick="addPopularStock('AMZN', 'Amazon')" class="p-2 text-left bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">
                        <div class="font-medium text-sm">📦 Amazon</div>
                        <div class="text-xs text-gray-600">AMZN</div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Error Message -->
    <div id="errorMessage" class="fixed top-4 left-1/2 transform -translate-x-1/2 bg-red-500 text-white px-4 py-2 rounded-lg z-30 hidden">
        <span id="errorText"></span>

        // 检测是否为移动设备
        function detectMobileDevice() {
            isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || 
                            ('ontouchstart' in window) || 
                            (navigator.maxTouchPoints > 0);
            return isMobileDevice;
        }
        
        // 初始化移动端横屏模式
        function initializeMobileLandscape() {
            if (detectMobileDevice()) {
                // 添加移动端横屏样式
                document.body.classList.add('mobile-landscape');
                
                // 尝试锁定屏幕方向为横向
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock('landscape').catch(err => {
                        console.log('无法锁定屏幕方向:', err);
                    });
                }
                
                // 尝试隐藏状态栏
                hideStatusBar();
                
                // 初始化缩放功能
                initializeZoomSupport();
                
                // 初始化左右切换功能
                initializeSwipeNavigation();
                
                console.log('✅ 移动端横屏模式已启用');
            }
        }
        
        // 初始化缩放功能
        function initializeZoomSupport() {
            if (!isMobileDevice) return;
            
            // 添加触摸事件监听器
            let initialDistance = 0;
            let initialScale = 1;
            let isZooming = false;
            
            // 双指触摸开始
            document.addEventListener('touchstart', function(e) {
                if (e.touches.length === 2) {
                    isZooming = true;
                    const touch1 = e.touches[0];
                    const touch2 = e.touches[1];
                    initialDistance = Math.sqrt(
                        Math.pow(touch2.clientX - touch1.clientX, 2) + 
                        Math.pow(touch2.clientY - touch1.clientY, 2)
                    );
                    initialScale = zoomLevel;
                    
                    console.log('🔍 开始双指缩放');
                }
            }, { passive: true });
            
            // 双指缩放移动
            document.addEventListener('touchmove', function(e) {
                if (e.touches.length === 2 && isZooming) {
                    e.preventDefault();
                    
                    const touch1 = e.touches[0];
                    const touch2 = e.touches[1];
                    const currentDistance = Math.sqrt(
                        Math.pow(touch2.clientX - touch1.clientX, 2) + 
                        Math.pow(touch2.clientY - touch1.clientY, 2)
                    );
                    
                    if (initialDistance > 0) {
                        const scale = (currentDistance / initialDistance) * initialScale;
                        const clampedScale = Math.max(0.5, Math.min(3.0, scale));
                        
                        zoomLevel = clampedScale;
                        applyZoom(clampedScale);
                    }
                }
            }, { passive: false });
            
            // 触摸结束
            document.addEventListener('touchend', function(e) {
                if (e.touches.length < 2 && isZooming) {
                    isZooming = false;
                    console.log('🔍 缩放结束，当前缩放:', Math.round(zoomLevel * 100) + '%');
                }
            }, { passive: true });
            
            
            console.log('✅ 缩放功能已初始化');
        }
        
        // 应用缩放
        function applyZoom(scale) {
            const mainContent = document.querySelector('.mx-auto');
            if (mainContent) {
                mainContent.style.transform = `scale(${scale})`;
                mainContent.style.transformOrigin = 'center center';
            }
        }
        
        
        // 初始化左右切换功能
        function initializeSwipeNavigation() {
            if (!isMobileDevice) return;
            
            // 触摸开始
            document.addEventListener('touchstart', function(e) {
                if (e.touches.length === 1 && !isZooming) {
                    swipeStartX = e.touches[0].clientX;
                    isSwipeActive = true;
                }
            }, { passive: true });
            
            // 触摸移动
            document.addEventListener('touchmove', function(e) {
                if (e.touches.length === 1 && isSwipeActive && !isZooming) {
                    swipeEndX = e.touches[0].clientX;
                }
            }, { passive: true });
            
            // 触摸结束
            document.addEventListener('touchend', function(e) {
                if (isSwipeActive && !isZooming) {
                    handleSwipeGesture();
                    isSwipeActive = false;
                }
            }, { passive: true });
            
            // 键盘导航支持
            document.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowLeft') {
                    navigateToPreviousStock();
                } else if (e.key === 'ArrowRight') {
                    navigateToNextStock();
                }
            });
            
            console.log('✅ 左右切换功能已初始化');
        }
        
        // 处理滑动手势
        function handleSwipeGesture() {
            const swipeThreshold = 50; // 最小滑动距离
            const swipeDistance = swipeEndX - swipeStartX;
            
            if (Math.abs(swipeDistance) > swipeThreshold) {
                if (swipeDistance > 0) {
                    // 向右滑动 - 上一只股票
                    navigateToPreviousStock();
                } else {
                    // 向左滑动 - 下一只股票
                    navigateToNextStock();
                }
            }
        }
        
        // 导航到上一只股票
        function navigateToPreviousStock() {
            if (watchList.length === 0) {
                console.log('🔇 关注列表为空');

            currentStockIndex = (currentStockIndex - 1 + watchList.length) % watchList.length;

            updateNavigationButtons();

        }
        
        // 导航到下一只股票
        function navigateToNextStock() {
            if (watchList.length === 0) {

        // 从关注列表切换到股票
        function switchToStockFromWatchList() {
            if (watchList.length === 0) return;
            
            const stock = watchList[currentStockIndex];
            const abbreviatedName = getAbbreviatedCompanyName(stock.name);
            currentStock = {

            // 立即更新股票名称
            document.getElementById('stockName').textContent = abbreviatedName;
            
            // 先显示缓存数据（如果有的话）

                const isPositive = stock.change >= 0;

        // 智能多API轮换系统
        async function fetchStockData(symbol, retryCount = 0) {
            const MAX_RETRIES = 2;
            const RETRY_DELAY = 1000; // 1秒重试延迟
            
            try {
                // 检查API调用频率限制
                const now = Date.now();
                if (now - lastApiCall < API_CALL_INTERVAL) {
                    const remainingTime = Math.ceil((API_CALL_INTERVAL - (now - lastApiCall)) / 1000);
                    console.log(`API调用过于频繁，请等待 ${remainingTime} 秒`);
                    return null;
                }
                
                // 检查每分钟调用次数限制
                if (apiCallCount >= MAX_API_CALLS_PER_MINUTE) {
                    console.log('已达到每分钟API调用限制，请稍后重试');
                    return null;
                }
                
                lastApiCall = now;
                apiCallCount++;
                
                // 每分钟重置计数器
                setTimeout(() => {
                    apiCallCount = Math.max(0, apiCallCount - 1);
                }, 60000);

                console.log(`🔄 正在调用API: ${symbol} (尝试 ${retryCount + 1}/${MAX_RETRIES + 1})`);
                
                // 智能选择API源（按优先级和可用性）
                const apiSources = getAvailableApiSources();
                
                // 尝试每个API源
                for (let i = 0; i < apiSources.length; i++) {
                    const source = apiSources[i];
                    try {
                        console.log(`🔄 尝试 ${source.name} API`);
                        
                        const response = await fetch(source.url, {
                            method: 'GET',
                            headers: {
                                'Accept': 'application/json',
                            },
                            // 添加超时控制
                            signal: AbortSignal.timeout(8000) // 8秒超时
                        });
                        
                        if (!response.ok) {
                            throw new Error(`${source.name} HTTP error! status: ${response.status}`);
                        }
                        
                        const data = await response.json();
                        const result = source.parser(data, symbol);
                        
                        if (result) {
                            console.log(`✅ ${source.name} API调用成功: ${symbol}`);
                            // 记录成功的API，下次优先使用
                            recordApiSuccess(source.name);
                            return result;
                        }
                        
                    } catch (error) {
                        console.warn(`${source.name} API失败:`, error.message);
                        // 记录失败的API
                        recordApiFailure(source.name);
                        if (i === apiSources.length - 1) {
                            throw error; // 最后一个API也失败了
                        }
                    }
                }
                
                // 如果所有API都失败，检查当前股票是否有缓存数据
                const currentStockData = watchList.find(stock => stock.symbol === symbol);
                if (currentStockData && currentStockData.price > 0) {
                    console.log('⚠️ API失败，使用当前股票的缓存数据');
                    return {
                        symbol: symbol,
                        price: currentStockData.price,
                        change: currentStockData.change || 0,
                        changePercent: currentStockData.changePercent || 0,
                        timestamp: new Date().toLocaleString(),
                        source: '缓存数据 (API不可用)'
                    };
                } else if (lastSuccessfulData && lastSuccessfulData.symbol === symbol) {
                    console.log('⚠️ API失败，使用全局缓存数据');
                    return {
                        ...lastSuccessfulData,
                        timestamp: new Date().toLocaleString(),
                        source: '缓存数据 (API不可用)'
                    };
                } else {
                    console.log('⚠️ 所有API都失败，使用模拟数据作为备用');
                    return generateFallbackData(symbol);
                }
                
            } catch (error) {
                console.error(`API调用失败 (尝试 ${retryCount + 1}):`, error.message);
                
                // 重试逻辑
                if (retryCount < MAX_RETRIES) {
                    console.log(`⏳ ${RETRY_DELAY/1000}秒后重试...`);
                    await new Promise(resolve => setTimeout(resolve, RETRY_DELAY));
                    return fetchStockData(symbol, retryCount + 1);
                }
                
                // 最终失败，检查当前股票是否有缓存数据
                const currentStockData = watchList.find(stock => stock.symbol === symbol);
                if (currentStockData && currentStockData.price > 0) {
                    console.log('⚠️ 所有重试都失败，使用当前股票的缓存数据');
                    return {
                        symbol: symbol,
                        price: currentStockData.price,
                        change: currentStockData.change || 0,
                        changePercent: currentStockData.changePercent || 0,
                        timestamp: new Date().toLocaleString(),
                        source: '缓存数据 (API不可用)'
                    };
                } else if (lastSuccessfulData && lastSuccessfulData.symbol === symbol) {
                    console.log('⚠️ 所有重试都失败，使用全局缓存数据');
                    return {
                        ...lastSuccessfulData,
                        timestamp: new Date().toLocaleString(),
                        source: '缓存数据 (API不可用)'
                    };
                } else {
                    console.log('⚠️ 所有重试都失败，使用模拟数据作为备用');
                    return generateFallbackData(symbol);
                }
            }
        }

        // 获取可用的API源（只使用Finnhub）
        function getAvailableApiSources() {
            const sources = [];
            
            // 只使用Finnhub
            if (API_CONFIGS.finnhub.key && API_CONFIGS.finnhub.key !== 'demo') {
                sources.push({

        // API成功/失败记录
        const apiStats = {};
        
        function recordApiSuccess(apiName) {
            if (!apiStats[apiName]) {
                apiStats[apiName] = { success: 0, failure: 0 };
            }
            apiStats[apiName].success++;
        }
        
        function recordApiFailure(apiName) {
            if (!apiStats[apiName]) {
                apiStats[apiName] = { success: 0, failure: 0 };
            }
            apiStats[apiName].failure++;
        }


        // Finnhub API响应解析器
        function parseFinnhubResponse(data, symbol) {
            if (!data.c || !data.pc) {
                throw new Error('Finnhub: 无效的API响应');
            }
            
            const price = data.c;
            const previousClose = data.pc;
            const change = price - previousClose;
            const changePercent = (change / previousClose) * 100;
            
            return {
                symbol: symbol,
                price: price,
                change: change,
                changePercent: changePercent,
                open: data.o || price,
                high: data.h || price,
                low: data.l || price,
                volume: 0, // Finnhub不提供成交量
                previousClose: previousClose,
                timestamp: new Date().toLocaleString(),
                source: 'Finnhub'
            };
        }

        // 生成备用数据（当所有API都失败时）
        function generateFallbackData(symbol) {
            const stockInfo = STOCK_DATABASE[symbol] || { name: symbol, basePrice: 100.00 };
            const basePrice = stockInfo.basePrice || 100.00;
            
            // 生成随机波动
            const volatility = 0.02;
            const changePercent = (Math.random() - 0.5) * volatility * 100;
            const change = (basePrice * changePercent) / 100;
            const price = basePrice + change;
            
            return {
                symbol: symbol,
                price: parseFloat(price.toFixed(2)),
                change: parseFloat(change.toFixed(2)),
                changePercent: parseFloat(changePercent.toFixed(2)),
                open: parseFloat((basePrice + (Math.random() - 0.5) * basePrice * 0.01).toFixed(2)),
                high: parseFloat((price + Math.random() * basePrice * 0.01).toFixed(2)),
                low: parseFloat((price - Math.random() * basePrice * 0.01).toFixed(2)),
                volume: Math.floor(10000000 * (1 + Math.abs(changePercent) * 10)),
                previousClose: basePrice,
                timestamp: new Date().toLocaleString(),
                source: '模拟数据 (API不可用)'
            };
        }

        function saveWatchList() {
            try {
                // 1. 保存到 LocalStorage (主要存储)
                localStorage.setItem('stockWatchList', JSON.stringify(watchList));
                
                // 2. 保存到 Cookie (备份，7天过期)
                const cookieData = encodeURIComponent(JSON.stringify(watchList));
                if (cookieData.length < 4000) { // Cookie 大小限制
                    document.cookie = `watchlist=${cookieData}; max-age=604800; path=/`;
                }
                
                // 3. 更新 URL 参数 (如果数据不太大)
                const urlData = encodeURIComponent(JSON.stringify(watchList));
                if (urlData.length < 1000) { // URL 长度限制
                    const url = new URL(window.location);
                    url.searchParams.set('watchlist', urlData);
                    window.history.replaceState({}, '', url);
                }
                
                console.log('✅ 关注列表已保存到多种存储方式');
            } catch (e) {
                console.error('Failed to save watch list:', e);

        // API搜索股票功能
        async function searchStocks(query) {
            if (!query || query.length < 1) {
                return [];
            }
            
            try {
                console.log(`🔍 正在搜索股票: ${query}`);
                
                const response = await fetch(`https://finnhub.io/api/v1/search?q=${encodeURIComponent(query)}&token=${API_CONFIGS.finnhub.key}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.result && Array.isArray(data.result)) {
                    console.log(`✅ 搜索到 ${data.result.length} 个结果`);
                    
                    // 转换API结果为应用格式
                    const results = data.result.slice(0, 10).map(stock => ({
                        symbol: stock.symbol,
                        name: stock.description || stock.symbol,
                        price: 0,
                        change: 0,
                        changePercent: 0,
                        lastUpdate: null,
                        matchType: 'api',
                        matchScore: 1
                    }));
                    
                    return results;
                } else {
                    console.log('ℹ️ 搜索无结果');
                    return [];
                }
                
            } catch (error) {
                console.error('❌ 股票搜索失败:', error);
                
                // 如果API失败，回退到本地搜索
                console.log('🔄 回退到本地搜索');
                return searchStocksLocal(query);
            }
        }

        // 本地搜索功能（作为API失败时的备用方案）
        function searchStocksLocal(query) {
            if (!query || query.length < 1) {
                return [];
            }
            
            const results = [];
            const lowerQuery = query.toLowerCase();
            
            for (const [symbol, stock] of Object.entries(STOCK_DATABASE)) {
                const symbolMatch = symbol.toLowerCase().includes(lowerQuery);
                const nameMatch = stock.name.toLowerCase().includes(lowerQuery);
                
                if (symbolMatch || nameMatch) {
                    results.push({
                        ...stock,
                        matchType: symbolMatch ? 'symbol' : 'name',
                        matchScore: symbolMatch ? 2 : 1
                    });
                }
            }
            
            return results.sort((a, b) => {
                if (a.matchScore !== b.matchScore) {
                    return b.matchScore - a.matchScore;
                }
                return a.name.localeCompare(b.name);
            });
        }

            // 更新按钮状态
            updateNavigationButtons();
            
            // 关闭搜索模态框
            hideSearchModal();
            
            // 显示成功消息
            showMessage(`已添加 ${name} (${symbol}) 到关注列表，正在加载数据...`, 'success');
            
            // 立即加载股票数据
            loadStockData(symbol);
        }

        // 添加热门股票
        function addPopularStock(symbol, name) {
            addStockFromSearch(symbol, name);
        }

        // 显示消息 - 只显示成功消息，隐藏所有错误信息
        function showMessage(message, type = 'success') {
            // 如果是错误信息，直接返回，不显示给用户
            if (type === 'error') {
                console.log('🔇 错误信息已隐藏:', message);
                return;
            }
            
            // 只显示成功消息
            const messageElement = document.getElementById('successMessage');
            const textElement = document.getElementById('successText');
            
            if (messageElement && textElement) {
            textElement.textContent = message;
            messageElement.classList.remove('hidden');
            
            setTimeout(() => {
                messageElement.classList.add('hidden');
            }, 3000);
            }
        }

        // UI 控制
        function toggleUI() {
            showUI = !showUI;
            if (showUI) {
                document.getElementById('menuButton').classList.remove('hidden');
                updateWatchListButton();
                console.log('✅ UI已显示');
            } else {
                document.getElementById('menuButton').classList.add('hidden');
                document.getElementById('controlMenu').classList.add('hidden');
                console.log('✅ UI已隐藏');
            }
        }

        function hideUI() {
            if (event) event.stopPropagation();
            showUI = false;
            document.getElementById('menuButton').classList.add('hidden');
            document.getElementById('controlMenu').classList.add('hidden');
        }
        
        // 菜单控制
        function toggleMenu(event) {
            if (event) {
                event.stopPropagation();
            }
            console.log('🔄 点击菜单按钮');
            const menu = document.getElementById('controlMenu');
            if (!menu) {
                console.error('❌ 找不到控制菜单元素');
                return;
            }
            
            if (menu.classList.contains('hidden')) {
                menu.classList.remove('hidden');
                console.log('✅ 菜单已打开');
            } else {
                menu.classList.add('hidden');
                console.log('✅ 菜单已关闭');
            }
        }
        
        function hideMenu() {
            document.getElementById('controlMenu').classList.add('hidden');
            document.getElementById('controlMenu').classList.add('hidden');
        }

        // 实时更新功能
        function toggleRealtimeData() {
            if (isRealtimeEnabled) {
                stopRealtimeData();
            } else {
                startRealtimeData();
            }
        }

        function startRealtimeData() {
            if (realtimeInterval) {
                clearInterval(realtimeInterval);
            }

            isRealtimeEnabled = true;

            // 立即开始第一次更新
            console.log('🔄 开始实时更新当前股票数据');
            loadStockData(currentStock.symbol);

            // 设置定时器，每4秒更新一次
            realtimeInterval = setInterval(() => {
                console.log(`🔄 实时更新: ${currentStock.name} (${currentStock.symbol})`);
                loadStockData(currentStock.symbol);
            }, 4000);

            // 更新按钮状态
            updateRealtimeButton();

            console.log('✅ 实时更新已开启（每4秒更新一次）');
        }

        function stopRealtimeData() {
            if (realtimeInterval) {
                clearInterval(realtimeInterval);
                realtimeInterval = null;
            }

            isRealtimeEnabled = false;

            // 更新按钮状态
            updateRealtimeButton();

            console.log('⏹️ 实时更新已停止');
        }

        function updateRealtimeButton() {
            const btn = document.getElementById('realtimeBtn');
            if (!btn) return;

            if (isRealtimeEnabled) {
                btn.textContent = '⏹️ 停止更新';
                btn.className = 'w-auto px-2 py-1 rounded text-xs font-medium bg-red-500 text-white hover:bg-red-600 transition-colors text-left whitespace-nowrap';
            } else {
                btn.textContent = '📡 实时更新';
                btn.className = 'w-auto px-2 py-1 rounded text-xs font-medium bg-purple-500 text-white hover:bg-purple-600 transition-colors text-left whitespace-nowrap';
            }
        }

        function updateWatchListButton() {
            const btn = document.getElementById('watchlistBtn');
            if (!btn) {
                // 按钮不存在，直接返回
                return;
            }
            
            if (isInWatchList()) {
                btn.textContent = '★ 已关注';
                btn.className = 'px-3 py-2 rounded-lg text-sm font-medium transition-colors bg-red-500 text-white hover:bg-red-600';
            } else {
                btn.textContent = '☆ 关注';
                btn.className = 'px-3 py-2 rounded-lg text-sm font-medium transition-colors bg-blue-500 text-white hover:bg-blue-600';
            }
            
            // 更新切换按钮状态
            updateNavigationButtons();
        }
        
        // 更新导航按钮状态
        function updateNavigationButtons() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            if (watchList.length <= 1) {
                // 关注列表为空或只有一只股票时，隐藏切换按钮
                prevBtn.classList.add('hidden');
                nextBtn.classList.add('hidden');
            } else {
                // 显示切换按钮
                prevBtn.classList.remove('hidden');
                nextBtn.classList.remove('hidden');
                
                // 更新按钮提示文本，显示当前位置
                const currentIndex = currentStockIndex + 1;
                const totalCount = watchList.length;
                prevBtn.title = `上一只股票 (${currentIndex}/${totalCount})`;
                nextBtn.title = `下一只股票 (${currentIndex}/${totalCount})`;
            }
        }


        // 错误处理
        window.addEventListener('error', function(e) {
            console.error('Global error:', e.error);
        });

        // 性能监控
        window.addEventListener('load', function() {
            // 记录页面加载时间
            const loadTime = performance.now();
            console.log(`页面加载时间: ${loadTime.toFixed(2)}ms`);
            
            // 发送性能数据到分析服务
            if (typeof gtag !== 'undefined') {
                gtag('event', 'page_load_time', {
                    'value': Math.round(loadTime)
                });
            }
        });
    </script>
</body>
</html>
